# 回家 Wi-Fi 的分流配置（样例，不是任何人的真实订阅）
#
# 这个文件只用来演示验收：它刻意保留了两类真实世界里常见的错误——
#   1. 一个很宽的 DOMAIN-SUFFIX 规则把国内域名提前送进了代理组；
#   2. github.com 走直连，而验收用例期望它走代理。
# 域名、IP 与节点都是 RFC 5737 / 文档示例地址，不是有效节点。

port: 7890
socks-port: 7891
mixed-port: 7892
allow-lan: false
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 1.1.1.1
    - 8.8.8.8

proxies:
  - name: HK-01
    type: ss
    server: 203.0.113.10
    port: 8388
    cipher: aes-256-gcm
  - name: JP-01
    type: ss
    server: 198.51.100.20
    port: 8388
    cipher: aes-256-gcm

proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - HK-01
      - JP-01
      - DIRECT
  - name: 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - HK-01
      - JP-01
  - name: 流媒体
    type: select
    proxies:
      - 节点选择
      - HK-01
      - JP-01
  - name: 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

rule-providers:
  domestic:
    type: file
    behavior: classical
    format: yaml
    path: ./rulesets/domestic.yaml
  ads:
    type: file
    behavior: domain
    format: yaml
    path: ./rulesets/ads.yaml

rules:
  - DOMAIN,api.github.com,节点选择
  - RULE-SET,ads,广告拦截
  - DOMAIN-SUFFIX,youtube.com,流媒体
  - DOMAIN-KEYWORD,google,节点选择
  - DOMAIN-SUFFIX,baidu.com,节点选择
  - DOMAIN-SUFFIX,api.weibo.com,节点选择
  - RULE-SET,domestic,DIRECT
  - DOMAIN-SUFFIX,github.com,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,节点选择
