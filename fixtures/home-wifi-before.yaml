# 「改动前」的同一份配置：只有两条误伤国内的规则还不存在。
# 它只用来生成 fixtures/baseline.json，演示基线对比能抓到什么。

port: 7890
mixed-port: 7892
allow-lan: false
mode: rule

proxies:
  - name: HK-01
    type: ss
    server: 203.0.113.10
    port: 8388
    cipher: aes-256-gcm
  - name: JP-01
    type: ss
    server: 198.51.100.20
    port: 8388
    cipher: aes-256-gcm

proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - HK-01
      - JP-01
      - DIRECT
  - name: 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - HK-01
      - JP-01
  - name: 流媒体
    type: select
    proxies:
      - 节点选择
      - HK-01
      - JP-01
  - name: 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

rule-providers:
  domestic:
    type: file
    behavior: classical
    format: yaml
    path: ./rulesets/domestic.yaml
  ads:
    type: file
    behavior: domain
    format: yaml
    path: ./rulesets/ads.yaml

rules:
  - DOMAIN,api.github.com,节点选择
  - RULE-SET,ads,广告拦截
  - DOMAIN-SUFFIX,youtube.com,流媒体
  - DOMAIN-KEYWORD,google,节点选择
  - RULE-SET,domestic,DIRECT
  - DOMAIN-SUFFIX,github.com,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,节点选择
