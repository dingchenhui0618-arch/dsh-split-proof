name: Publish

# 用 Trusted Publishing（OIDC）发布：仓库里没有任何 NODE_AUTH_TOKEN secret，
# 也没有 2FA 提示。GitHub 为这次运行签发一次性 OIDC token，npm 拿它对照该包
# 配置好的 Trusted Publisher 校验，然后只在这一条命令期间给出发布凭据。
#
# npm 侧一次性配置（包必须先在 registry 上存在，这个页面才让你配东西）：
#
#   https://www.npmjs.com/package/dsh-split-proof/settings -> Trusted Publisher
#     Organization or user: dingchenhui0618-arch
#     Repository:           dsh-split-proof
#     Workflow filename:    publish.yml
#     Environment:          （留空）
#
# 首次发布需要先让包在 registry 上存在；在那之前这个工作流不会被执行。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted Publishing 需要 npm CLI 11.5.1+；Node 22 自带 npm 10.x。
      - name: Upgrade npm
        run: npm install -g npm@latest

      # lib/ 是构建产物且已入库：确认它确实等于 src/ 的构建结果。
      - name: Check lib/ matches src/
        run: |
          node scripts/build.mjs
          git diff --exit-code -- lib

      - name: Test
        run: npm test

      - name: Verify the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#v}
          if [ "$pkg" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "Publishing $pkg"

      - name: Check whether this version is already published
        id: published
        run: |
          pkg="dsh-split-proof@$(node -p "require('./package.json').version")"
          if npm view "$pkg" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$pkg 已在 registry 上，跳过发布。"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$pkg 尚未发布。"
          fi

      - name: Publish
        if: steps.published.outputs.exists == 'false'
        run: npm publish --provenance --access public
